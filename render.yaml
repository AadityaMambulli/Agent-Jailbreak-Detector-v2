# Render Blueprint — single web service.
#
# The frontend calls the API via relative `/api/*` paths, so it MUST be served
# from the same origin as Flask. app.py already serves the built React SPA
# (frontend/dist) as static files + SPA fallback alongside the /api/* routes,
# so one service serving both is the correct architecture — no proxy or CORS
# changes needed.
services:
  - type: web
    name: razorpay-agentic-jailbreak-detector
    runtime: python
    plan: free
    pythonVersion: 3.12.10
    buildCommand: "cd frontend && npm ci && npm run build"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4"
    envVars:
      - key: PYTHONUNBUFFERED
        value: true